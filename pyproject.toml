[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "harbor-metaflow-backend"
version = "0.1.0"
description = "Run Harbor trials on AWS Batch with Metaflow (trial backend for harbor run --backend)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Autodesk, Inc." }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Needs a Harbor with pluggable trial backends (`harbor run --backend`). Until that
# is released, install Harbor from the hook branch first (see README).
dependencies = [
    "harbor>=0.24",
    "metaflow>=2.12",
]

[project.optional-dependencies]
s3 = ["boto3>=1.28"]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.entry-points."harbor.backends"]
metaflow-batch = "harbor_metaflow_backend:MetaflowBatchBackend"

[project.urls]
Homepage = "https://github.com/AutodeskAILab/harbor-metaflow-backend"
Issues = "https://github.com/AutodeskAILab/harbor-metaflow-backend/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/harbor_metaflow_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B904"]

[tool.ruff.lint.isort]
known-first-party = ["harbor_metaflow_backend"]
known-local-folder = ["conftest"]
