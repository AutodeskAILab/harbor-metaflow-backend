name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        harbor:
          # The trial backend hook is pending upstream; test against the hook branch.
          - name: hook-branch
            spec: "harbor @ git+https://github.com/AutodeskAILab/harbor@feat/backend-plugins"
          # Released Harbor without the hook: the backend must refuse clearly.
          - name: released
            spec: "harbor"
    name: test (python 3.12, harbor ${{ matrix.harbor.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "${{ matrix.harbor.spec }}"
          pip install -e ".[s3,dev]"
      - run: python -m pytest -q
